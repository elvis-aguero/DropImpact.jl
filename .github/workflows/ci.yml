name: CI

on:
  push:
    branches: [main, dev, 'dev-**']
  pull_request:
    branches: [main, dev, 'dev-**']
  workflow_dispatch:
    inputs:
      fluid:
        description: "Working fluid to compare against (water or oil)"
        type: choice
        options: [oil, water]
        default: oil
      selector:
        description: "Contact-edge rule"
        type: choice
        options: [feasible, crossing]
        default: feasible
      viscous:
        description: "Drop viscous closure"
        type: choice
        options: [reid, lamb]
        default: reid
      run_selector_regression:
        description: "Run the selector regression gate (both rules, 5 anchor points each, hours)"
        type: boolean
        default: false

jobs:
  julia-tests:
    name: SpectralKM test suite (Julia ${{ matrix.julia-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia-version: ["1.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1

  cas-derivations:
    name: CAS re-derivation scripts (Symbolics.jl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
      - uses: julia-actions/cache@v2
      - name: Instantiate derivations/ project
        run: julia --project=derivations -e 'using Pkg; Pkg.instantiate()'
      - name: Run verify_accel_closure.jl
        run: julia --project=derivations derivations/verify_accel_closure.jl
      # The pressure-basis derivation is the one the contact closure rests on: it proves the
      # degree identity and the projection degrees exactly, in Rational{BigInt}. It runs in
      # seconds, so there is no reason for it not to gate every push.
      - name: Run verify_legendre_pressure_basis.jl
        run: julia --project=derivations derivations/verify_legendre_pressure_basis.jl
      # This one runs against the PACKAGE project (root), not derivations/, so it needs its
      # own instantiate step -- the job above only sets up derivations/.
      - name: Instantiate root package project
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      # Backs every number quoted in the design doc's wall-condition subsection.
      - name: Run feasibility_pinned_contact_line.jl
        run: julia --project=. derivations/feasibility_pinned_contact_line.jl

  # THE SELECTOR REGRESSION GATE. Runs test_experiment_regression.jl -- contact time AND maximum
  # penetration depth within 2 sd of experiment, at DEFAULT truncation, over five anchor points
  # spanning We = 0.73..7.31 in both fluids -- under BOTH contact-edge rules, on identical runners.
  #
  # This exists to answer one question before the default is changed: does :crossing, which rescues
  # the high-We oil case where :feasible lets the drop sink, break any case that :feasible got
  # right? `fail-fast: false` so the :feasible leg still reports even when it fails, since HOW it
  # fails is the evidence.
  #
  #   gh workflow run CI -f run_selector_regression=true
  #
  selector-regression:
    name: Selector regression vs experiment (${{ matrix.selector }})
    if: github.event_name == 'workflow_dispatch' && inputs.run_selector_regression
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        selector: [crossing, feasible]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - name: Run the regression gate
        env:
          SPECTRALKM_EXPERIMENT_REGRESSION: "1"
          SPECTRALKM_SELECTOR: ${{ matrix.selector }}
        run: julia --project=. -e 'using Test; using SpectralKM; using DelimitedFiles; using Printf; include("test/test_experiment_regression.jl")'

  # THE FLUID-EXPERIMENT COMPARISON. One simulation per experimental point at production
  # truncation, ~3.5 minutes each, so ~45 minutes for the 12 oil points. Far too slow to gate every
  # push, and far too slow to run on a laptop -- hence its own manually dispatched job. Run it
  # whenever anything touching the contact closure, the drop closure or the metric changes.
  #
  #   gh workflow run CI -f fluid=oil
  #
  fluid-experiment:
    # Static name: `inputs` does not exist for push/pull_request events, so interpolating it here
    # renders the raw ${{ }} expression in the checks list on every PR.
    name: Contact time vs bath experiment
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - name: Compare against the experimental points
        run: |
          julia --project=. scripts/compare_fluid_experiment.jl "${{ inputs.fluid || 'oil' }}" \
            --selector "${{ inputs.selector || 'feasible' }}" \
            --viscous "${{ inputs.viscous || 'reid' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: model-vs-experiment-${{ inputs.fluid || 'oil' }}
          path: data/experiments/model_vs_experiment_*.csv
